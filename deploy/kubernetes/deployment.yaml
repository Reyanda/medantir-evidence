apiVersion: apps/v1
kind: Deployment
metadata:
  name: medantir-evidence
  namespace: medantir-evidence
  labels:
    app.kubernetes.io/name: medantir-evidence
    app.kubernetes.io/part-of: medantir-evidence-os
    app.kubernetes.io/component: review-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: medantir-evidence
      app.kubernetes.io/component: review-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medantir-evidence
        app.kubernetes.io/part-of: medantir-evidence-os
        app.kubernetes.io/component: review-service
    spec:
      serviceAccountName: medantir-evidence
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: review-service
          image: ghcr.io/reyanda/medantir-evidence-review:0.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8788
              protocol: TCP
          envFrom:
            - configMapRef:
                name: medantir-evidence-config
          env:
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: CORS_ORIGINS
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: COGNITO_CLIENT_ID
            - name: REVIEW_CREDENTIAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: REVIEW_CREDENTIAL_MASTER_KEY
            - name: ORCID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: ORCID_CLIENT_ID
                  optional: true
            - name: ORCID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: ORCID_CLIENT_SECRET
                  optional: true
            - name: ORCID_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: ORCID_REDIRECT_URI
                  optional: true
            - name: OMNIROUTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: OMNIROUTE_API_KEY
                  optional: true
            - name: SEMANTIC_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: SEMANTIC_EMBEDDING_API_KEY
                  optional: true
            - name: SEMANTIC_EMBEDDING_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: SEMANTIC_EMBEDDING_BASE_URL
                  optional: true
            - name: SEMANTIC_EMBEDDING_MODEL
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: SEMANTIC_EMBEDDING_MODEL
                  optional: true
            - name: SEMANTIC_EMBEDDING_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: SEMANTIC_EMBEDDING_PROVIDER
                  optional: true
            - name: SEMANTIC_EMBEDDING_MODEL_VERSION
              valueFrom:
                secretKeyRef:
                  name: medantir-evidence-secrets
                  key: SEMANTIC_EMBEDDING_MODEL_VERSION
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medantir-evidence-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
