services:
  review:
    build:
      context: ./medantir-review
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      REVIEW_LIVE: "1"
      REVIEW_DATA_ROOT: /data
      RUNS_FILE: /data/control/runs.json
      REVIEW_DURABILITY_ROOT: /data/durability
      REVIEW_CREDENTIAL_ROOT: /data/credentials
      REVIEW_CREDENTIAL_KEY_FILE: /data/secrets/credential-master.key
      PARSE_URL: ${PARSE_URL:-https://api.actiora.com/parse}
      REVIEW_BRIDGE_URL: ${REVIEW_BRIDGE_URL:-http://host.docker.internal:10086}
    volumes:
      - review_data:/data
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8788}:8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  review_data:
