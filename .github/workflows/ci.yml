name: ci

on:
  push:
  pull_request:

concurrency:
  group: medantir-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  review-engine:
    name: Review service — production typecheck and operational tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medantir-review/package-lock.json
      - run: npm ci
        working-directory: medantir-review
      - run: npm run typecheck:production
        working-directory: medantir-review
      - run: npm run test:production
        working-directory: medantir-review
        env:
          TEST_FILE_TIMEOUT_MS: "60000"

  production-image:
    name: Review service — production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./medantir-review
          push: false
          tags: medantir-review:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kubernetes:
    name: Evidence OS — Kubernetes deployment invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render kustomization
        run: kubectl kustomize deploy/kubernetes > /tmp/medantir-evidence-kubernetes.yaml
      - name: Verify single-replica security boundary
        shell: bash
        run: |
          set -euo pipefail
          rendered=/tmp/medantir-evidence-kubernetes.yaml
          grep -q '^kind: Deployment$' "$rendered"
          grep -q '^kind: PersistentVolumeClaim$' "$rendered"
          grep -q '^kind: Service$' "$rendered"
          grep -q 'replicas: 1' "$rendered"
          grep -q 'type: Recreate' "$rendered"
          grep -q 'runAsNonRoot: true' "$rendered"
          grep -q 'readOnlyRootFilesystem: true' "$rendered"
          grep -q 'automountServiceAccountToken: false' "$rendered"
          if grep -q '^kind: HorizontalPodAutoscaler$' "$rendered"; then
            echo 'Evidence OS baseline must not include horizontal autoscaling.' >&2
            exit 1
          fi

  semantic-browser-e2e:
    name: Semantic Evidence — real-browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            medantir-review/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Install review-service dependencies
        run: npm ci
        working-directory: medantir-review
      - name: Build the production review service
        run: npm run build:production
        working-directory: medantir-review
      - name: Build the frontend against the fixture service
        run: npm run build
        env:
          VITE_REVIEW_API_URL: http://127.0.0.1:8790
      - name: Install the isolated Playwright harness
        run: npm install --no-audit --no-fund
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Execute review-to-browser semantic E2E
        shell: bash
        run: |
          set -euo pipefail
          rm -rf e2e/.semantic-state e2e/.semantic-run.json e2e/test-results e2e/playwright-report

          node e2e/semantic-fixture-server.mjs >/tmp/medantir-semantic-api.log 2>&1 &
          api_pid=$!
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/medantir-semantic-ui.log 2>&1 &
          ui_pid=$!

          cleanup() {
            kill "$ui_pid" "$api_pid" 2>/dev/null || true
            wait "$ui_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          diagnostics() {
            echo '--- semantic fixture service ---'
            cat /tmp/medantir-semantic-api.log || true
            echo '--- semantic frontend preview ---'
            cat /tmp/medantir-semantic-ui.log || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              diagnostics
              exit 1
            fi
            if [[ -s e2e/.semantic-run.json ]] \
              && curl -fsS http://127.0.0.1:4173/medantir-evidence/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != "1" ]]; then
            diagnostics
            echo 'Browser E2E stack did not become ready.' >&2
            exit 1
          fi

          if ! (cd e2e && npx playwright test --config=playwright.config.mjs); then
            diagnostics
            exit 1
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-browser-e2e-${{ github.sha }}
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
